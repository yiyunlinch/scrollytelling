<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <title>sketchanddraw</title>

  <link href="./css/resets.css?v=7" rel="stylesheet" />
  <link href="./css/variables.css?v=7" rel="stylesheet" />
  <link href="./css/animations.css?v=7" rel="stylesheet" />
  <link href="./css/main.css?v=18" rel="stylesheet" />
</head>

<body>
<header style="display: contents;"></header>

<main>

  <div class="cover-transition-wrapper">
    <div class="cover-h-row">
      <div class="cover-h-sticky">
        <div class="cover-h-track">
          <!-- Page 1: eye interaction -->
          <section class="page page1" id="page1" aria-label="Page 1: eye interaction">
            <div class="eye-interaction-container">
              <div class="eye-layer-stack">
                <img class="eye-layer eye-layer-base" src="./images/Maxi/Maxi5.jpg" alt="Maxi5 background">
                <img class="eye-layer eye-layer-middle" src="./images/sheepeye.png" alt="Sheep eye">
                <img class="eye-layer eye-layer-top" src="./images/sheepblack.jpg" alt="Sheep black silhouette">
              </div>
              <div class="click-icon click-pos-bottom-center" id="clickIconPage1">
                <img src="./images/click.webp" alt="Click hint">
              </div>
            </div>
          </section>

          <!-- Page 2: grass field -->
          <section class="page page2" id="page2" aria-label="Page 2: grass field">
            <main class="scene" id="scene1">
              <div class="season grass active" aria-hidden="true"></div>
                 <div class="page3-title-overlay" aria-hidden="true">
      <img src="./images/title.png" alt="title" loading="lazy">
    </div>
  


              <div class="flock" id="flock-page1" aria-hidden="true">
                <div class="sheep" id="sheep1" style="background-image:url('./images/sheep/sheep1.webp')"></div>
                <div class="sheep" id="sheep2" style="background-image:url('./images/sheep/sheep2.webp')"></div>
                <div class="sheep" id="sheep3" style="background-image:url('./images/sheep/sheep3.webp')"></div>
    
              </div>
            </main>

            <div class="handhandy-wrap">
              <img src="./images/hand/handhandy.webp"
                   alt="handhandy"
                   id="handhandyImg"
                   class="handhandy-img">
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <!-- Hero sheep (fixed layer) -->
  <div id="sheephero-wrapper" aria-hidden="true">
    <video class="sheep sheephero"
           id="sheephero"
           src="./images/sheep/herosheep.webm"
           autoplay
           muted
           loop
           playsinline></video>
    <div class="hero-text" id="heroText">
      <img id="heroTextImg" alt="hero text" loading="lazy">
    </div>
  </div>

  <!-- Page 3: autumn upper -->
  <section class="page page3" id="page3" aria-label="Page 3: autumn upper half">
    <div class="backgroundtop"
         style="background-image:url('./images/autumn.jpg');"
         aria-hidden="true"></div>

 
 
  
    <div class="handflower-wrap">
      <img src="./images/hand/handflower.webp" alt="handflower" id="handflowerImg" class="handflower-img">
    </div>
    <div class="pole-wrap">
      <img src="./images/hand/pole.png" alt="pole" id="poleImg" class="pole-img">
    </div>
    <div class="hand-wrap">
      <img src="./images/hand/hand.webp" alt="hand" id="handImg4" class="hand-img">
    </div>
  </section>

  <!-- Page 4: autumn lower -->
  <section class="page page4" id="page4" aria-label="Page 4: autumn lower half">
    <div class="backgroundbottom"
         style="background-image:url('./images/autumn.jpg');"
         aria-hidden="true"></div>

    <div class="fade-to-black" aria-hidden="true"></div>
    <div class="pol1-wrap">
      <img src="./images/hand/pole1.png" alt="pol1" id="pol1Img" class="pol1-img">
    </div>
  </section>


  <!-- Page 5: construction upper -->
  <section class="page page5" id="page5" aria-label="Page 5: construction upper half">
    <div class="backgroundtop"
         style="
           background-image: url('./images/baustelle.jpg');
           background-size: 100% 200%;
           background-position: center top;
           background-repeat: no-repeat;
         "
         aria-hidden="true"></div>
    <!-- Digger (loops left/right only within page 5) -->
    <div id="digger-fixed" aria-hidden="true">
      <video src="./images/digger.webm"
             autoplay
             muted
             loop
             playsinline
             style="width:100%;height:100%;object-fit:contain;display:block;">
      </video>
    </div>

    <div class="privat-drop" id="privatDrop" aria-hidden="true">
      <img src="./images/hand/privat.png" alt="privat" class="privat-img">
    </div>

    <div class="text-group-left" style="color:#ffffff;">
   
    </div>

    <div class="kinder-wrap">
      <img src="./images/kinder.webp" alt="Kinder" class="kinder-img" id="kinderImg" />
    </div>

    <div id="dialogOverlay">
      <img id="schauLeft"  class="dialog-img" src="./images/text/schauleft.png"  alt="Schau left">
      <img id="schauRight" class="dialog-img" src="./images/text/schauright.png" alt="Schau right">
    </div>
  </section>

  <!-- Page 6: construction lower -->
  <section class="page page6" id="page6" aria-label="Page 6: construction lower half">
    <div class="backgroundbottom"
         style="
           background-image: url('./images/baustelle.jpg');
           background-size: 100% 200%;
           background-position: center bottom;
         background-repeat: no-repeat;
       "
         aria-hidden="true"></div>

    <div class="car-wrap" aria-hidden="true">
      <video class="car-video" autoplay muted loop playsinline preload="auto">
        <source src="./images/car.webm" type="video/webm">
      </video>
    </div>

    <div class="nur-overlay" id="nurOverlay" aria-hidden="true">
      <img src="./images/text/nur.png" alt="Nur">
    </div>

    <div class="schild-wrap" aria-hidden="true">
      <img src="./images/text/schild.png" alt="Schild" class="schild-img">
    </div>

    <div class="house-video-wrap" id="houseVideoWrap" aria-hidden="true">
      <img src="./images/building/1.png" alt="building layer 1" class="building-layer">
      <img src="./images/building/2.png" alt="building layer 2" class="building-layer">
      <img src="./images/building/3.png" alt="building layer 3" class="building-layer">
      <img src="./images/building/4.png" alt="building layer 4" class="building-layer">
    </div>

    <div class="click-icon click-pos-bottom-center is-hidden" id="clickIconPage6">
      <img src="./images/click.webp" alt="Click">
    </div>
  </section>

  <!-- Page 7: sheep outline + poem + reveal text on click -->
  <section class="page page7" id="page7" aria-label="Page 7: Fenster">
    <img class="sheep-outline-base" src="./images/sheepwhitefinal.webp" alt="Sheep outline">

    <div class="text-group-right" id="page7Yiyun">
      <img src="./images/text/yiyun.png" alt="Yiyun" class="page7-yiyun-img">
    </div>

    <div class="click-icon" id="clickIconFinal">
      <img src="./images/click.webp" alt="Click">
    </div>

    <div class="eimal-overlay" id="eimalOverlay" aria-hidden="true">
      <img src="./images/text/eimal.png" alt="eimal">
    </div>

    <div class="end-image" aria-hidden="true">
      <img src="./images/ende.png" alt="Ende">
    </div>

  

            <div class="handflower-wrap">
              <img src="./images/hand/handflower.webp"
                   alt="handflower"
                   id="lastHandflowerImg"
                   class="last-handflower">
            </div>

    <aside class="global-scrollbar">
      <div class="scrollbar-track">
        <div class="scrollbar-thumb"></div>
      </div>
    </aside>
  </section>

  <!-- Global volume toggle -->
  <button class="volume-toggle muted" id="volumeToggle" aria-label="Mute" type="button">🔇</button>
  <button class="down-arrow" id="globalDownArrow" aria-label="Scroll to next page" aria-hidden="true" type="button">
    <span class="arrow-stem"></span>
    <span class="arrow-head"></span>
  </button>
</main>

<audio id="kinderAudio" preload="auto" src="./sound/kinder.mp3"></audio>
<audio id="sheepAudio" preload="auto" src="./sound/sheep.mp4"></audio>
<audio id="noiceAudio" preload="auto" src="./sound/noice.mp4"></audio>
<audio id="birdAudio" preload="auto" src="./sound/bird.mp3"></audio>


<script defer src="./script.js?v=16"></script>

<footer style="display: contents;"></footer>

</body>
</html>
